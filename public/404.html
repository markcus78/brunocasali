<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="robots" content="noindex, nofollow">
    <title>Bruno Casali</title>
    <script type="text/javascript">
      // SPA fallback per GitHub Pages.
      // ⚠️ pathSegmentsToKeep = 1 perché ora è una project page (/brunocasali/).
      // Passando al dominio proprio va rimesso a 0, insieme a base in vite.config.ts.
      // Riscrive l'URL come query string e ricarica index.html, che la riconverte in pathname.
      var pathSegmentsToKeep = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
